# Runs on every pull request (and on pushes to working branches), so you can see a green check
# or a red X before merging. It uses the data already in the repo; it doesn't call any APIs.
name: Check

on:
  pull_request:
  push:
    branches-ignore: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      - name: Rules and data checks
        run: npm test

      - name: The site builds
        run: npm run build

      - name: Accessibility (WCAG 2.2 AA, desktop and phone)
        run: |
          npx playwright install --with-deps chromium
          npm run test:a11y
